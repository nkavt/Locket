name: Feature request
description: Suggest a concrete improvement to Locket
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, start a [discussion](https://github.com/nkavt/Locket/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this myself.
