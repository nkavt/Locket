name: Release

# Builds the macOS app and publishes a GitHub Release whenever a version tag
# is pushed:  git tag v0.4.3 && git push origin v0.4.3
# The tag must match the version in package.json.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build macOS and publish release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package macOS (arm64 + x64, unsigned)
        run: npm run dist:mac
        env:
          # No Developer ID certificate yet: skip signing and notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
